<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="description" content="Phoenix Kuwait — premier construction and contracting company in Kuwait. Building landmarks with precision, integrity and craftsmanship." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Phoenix Kuwait | Construction & Contracting" />
    <meta property="og:description" content="Premier construction and contracting company in Kuwait. Building landmarks with precision and craftsmanship." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_KW" />

    <!-- Fonts: Poppins (EN display), Inter (EN body), Cairo (Arabic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>Phoenix Kuwait | Construction & Contracting</title>
  </head>
  <body>
    <!-- Hidden form so Netlify can detect and wire up the contact form at build time -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
